<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus 360 - College Portal Login</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="login-body-clean">

<div class="login-card-clean shadow-sm">
    <!-- Brand Header -->
    <div class="text-center mb-4">
        <div class="login-logo-circle mb-3">
            <i class="bi bi-mortarboard-fill text-primary fs-2"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Campus 360</h3>
        <p class="text-muted small mb-0">College Management Portal</p>
    </div>

    <!-- Error or Logout Alerts -->
    <div th:if="${param.error}" class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-3 rounded-3">
        <i class="bi bi-exclamation-circle-fill text-danger"></i>
        <span>Invalid username or password. Please try again.</span>
    </div>
    <div th:if="${param.logout}" class="alert alert-info py-2 px-3 small d-flex align-items-center gap-2 mb-3 rounded-3">
        <i class="bi bi-check-circle-fill text-info"></i>
        <span>You have successfully signed out.</span>
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post" id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-dark">Username / Roll No / ID</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. 2026IT01 or prof01" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label small fw-semibold text-dark">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
    </form>

    <!-- Quick Demo Logins -->
    <div class="mt-4 pt-3 border-top text-center">
        <p class="text-muted small mb-2 fw-medium">Quick Demo Login (1-Click):</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-3" onclick="quickFillAndSubmit('prof01', 'password123')">
                <i class="bi bi-person-workspace me-1"></i> Teacher (prof01)
            </button>
            <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="quickFillAndSubmit('2026IT01', 'password123')">
                <i class="bi bi-mortarboard me-1"></i> 2nd Yr IT (2026IT01)
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="quickFillAndSubmit('2026FEIT01', 'password123')">
                <i class="bi bi-person me-1"></i> 1st Yr IT (2026FEIT01)
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="quickFillAndSubmit('admin01', 'password123')">
                <i class="bi bi-building me-1"></i> Staff (admin01)
            </button>
        </div>
    </div>

    <div class="text-center mt-4">
        <small class="text-muted" style="font-size: 0.78rem;">Campus 360 &bull; Secure College ERP</small>
    </div>
</div>

<script>
    function quickFillAndSubmit(username, password) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
        document.getElementById('loginForm').submit();
    }
</script>
</body>
</html>
