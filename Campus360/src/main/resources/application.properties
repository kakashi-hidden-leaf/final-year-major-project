server.port=8080

# Spring Application Name
spring.application.name=campus360

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campus360_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart / File Upload Configuration (Max 10MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom File Upload Path
app.upload.dir=./uploads/
app.upload.vault-dir=./uploads/vault/
app.upload.assignments-dir=./uploads/assignments/
app.upload.issues-dir=./uploads/issues/

# Thymeleaf Cache (disable for development reloading)
spring.thymeleaf.cache=false
